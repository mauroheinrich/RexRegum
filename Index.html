<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rex Regum | Colección Génesis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-neutral-950 text-neutral-100 overflow-x-hidden selection:bg-white selection:text-black">

    <nav class="fixed w-full z-40 bg-neutral-950/80 backdrop-blur-md border-b border-neutral-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <span class="text-2xl font-black tracking-tighter uppercase">Rex Regum</span>
            <button onclick="toggleCart()" class="relative p-2 group hover:text-neutral-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span id="cart-badge" class="absolute top-0 right-0 bg-white text-black text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </nav>

    <section class="relative h-[70vh] flex items-center justify-center">
        <div class="absolute inset-0 bg-black opacity-40 z-10"></div>
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1552066344-24632e574638?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center grayscale mix-blend-luminosity"></div>
        <div class="relative z-20 text-center px-4">
            <h1 class="text-5xl md:text-8xl font-black tracking-tighter uppercase mb-4">Colección Génesis</h1>
            <p class="text-sm md:text-base text-neutral-400 mb-8 font-light tracking-[0.3em] uppercase">Vestir la Fe con Estilo</p>
            <button onclick="document.getElementById('catalogo').scrollIntoView()" class="bg-white text-black font-bold uppercase tracking-widest text-xs py-4 px-10 hover:bg-neutral-300 transition-all">Explorar</button>
        </div>
    </section>

    <section id="catalogo" class="max-w-7xl mx-auto px-4 sm:px-6 py-20">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-12">
            </div>
    </section>

    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[450px] bg-neutral-950 border-l border-neutral-800 z-50 translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-neutral-800 flex justify-between items-center">
            <h2 class="text-lg font-bold uppercase tracking-widest">Carrito de Compras</h2>
            <button onclick="toggleCart()" class="text-neutral-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t border-neutral-800 bg-neutral-900/30">
            <div class="flex justify-between text-xl mb-6 uppercase">
                <span class="text-neutral-500">Total</span>
                <span id="cart-total" class="font-black">$0</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-white text-black font-black uppercase tracking-widest py-5 hover:bg-neutral-300 transition-all">Enviar pedido por WhatsApp</button>
        </div>
    </div>
    
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden"></div>

    <script src="js/productos.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
